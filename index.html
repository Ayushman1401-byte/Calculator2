<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="center">Welcome to Human made Calculator</h1>
    <div class="container">
        <input class="input" type="text">
        <br>
        <div class="row">
         <button id="c1"  class="button">C</button>
         <button id="c1"  class="button">%</button>
        </div>
        <br>
        <div class="row">
         <button class="button">7</button>
         <button class="button">8</button>
         <button class="button">9</button>
         <button id="b5"  class="button">*</button>
        </div>
        <br>
         <div class="row">
         <button class="button">4</button>
         <button class="button">5</button>
         <button class="button">6</button>
         <button id="b1"  class="button">/</button>
        </div>
        <br>
         <div class="row">
         <button class="button">1</button>
         <button class="button">2</button>
         <button class="button">3</button>
         <button id="b2"  class="button">+</button>
        </div>
        <br>
         <div class="row">
         <button class="button">0</button>
         <button id="b4"  class="button">.</button>
         <button class="button">=</button>
         <button id="b3"  class="button">-</button>
        </div>
        <br>
    </div>
    <script src="script.js"></script>
</body>
</html>
